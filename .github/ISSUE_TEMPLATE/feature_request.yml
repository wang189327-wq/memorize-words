name: 功能建议
description: 描述你想完成的学习任务和当前遇到的障碍。
body:
  - type: textarea
    id: need
    attributes:
      label: 使用场景与需要解决的问题
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 希望的操作或结果
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的方法及相关限制
